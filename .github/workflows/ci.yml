name: CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate-project:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Verify project structure
      run: |
        test -d ingestion
        test -d music_analytics
        test -d notebooks
        test -d tests

    - name: Check Python syntax
      run: |
        python -m compileall ingestion
        python -m compileall tests
        python -m compileall dashboard
        python  -m compileall orchestration/dags

    - name: Install dbt
      run: |
        pip install dbt-core dbt-snowflake

    - name: Create CI dbt profile
      run: |
        mkdir -p ~/.dbt
        printf '%s\n' \
        'music_analytics:' \
        '  target: dev' \
        '  outputs:' \
        '    dev:' \
        '      type: snowflake' \
        '      account: dummy_account' \
        '      user: dummy_user' \
        '      password: dummy_password' \
        '      role: dummy_role' \
        '      database: MUSIC_ANALYTICS' \
        '      warehouse: COMPUTE_WH' \
        '      schema: BRONZE' \
        '      threads: 1' \
        > ~/.dbt/profiles.yml
        echo "Generated dbt profile:"
        cat ~/.dbt/profiles.yml

    - name: dbt dependencies
      working-directory: music_analytics
      run: |
        dbt deps

    - name: Validate dbt project
      working-directory: music_analytics
      run: |
        dbt parse


    - name: Run Great Expectations validation
      run: |
        if [ -f data/processed/music_metadata_clean.parquet ]; then
          python tests/validate_metadata_gx.py
        else
          echo "Processed dataset is not committed; skipping local-data GX validation."
        fi
    - name: CI complete 
      run: |
        echo "Project validation completed successfully."